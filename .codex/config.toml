# Codex Duo is enabled for user-requested project development; saved defaults govern each task.
# The user selects the main chat model; saved Duo settings govern worker models.

[agents]
enabled = true
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "high"

[features]
hooks = false

[plugins."codex-duo@codex-duo-local"]
enabled = true
